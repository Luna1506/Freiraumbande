server {
    listen 80;

    # Muss zum Spring-Limit passen (max-request-size: 15MB)
    client_max_body_size 15m;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        # index.html nie stale aus dem Browser-Cache bedienen — sonst zeigen
        # alte Builds auf nicht mehr existierende Asset-Hashes (kaputter Hintergrund)
        add_header Cache-Control "no-cache";
    }

    # Gehashte Vite-Assets: dauerhaft cachebar, fehlende Hashes sind ein echter 404
    # (ohne eigenen Block würde try_files dafür index.html als "Bild" ausliefern)
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /db/ {
    proxy_pass http://adminer:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    }

    location /swagger-ui/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /v3/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    }
}